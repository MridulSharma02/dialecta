services:
  - type: web
    name: dialecta-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: SUPABASE_URL
        fromGroup: dialecta-secrets
      - key: SUPABASE_ANON_KEY
        fromGroup: dialecta-secrets
      - key: SUPABASE_SERVICE_KEY
        fromGroup: dialecta-secrets
      - key: JWT_SECRET
        fromGroup: dialecta-secrets
      - key: GROQ_API_KEY
        fromGroup: dialecta-secrets
      - key: GEMINI_API_KEY
        fromGroup: dialecta-secrets
      - key: RESEND_API_KEY
        fromGroup: dialecta-secrets
    healthCheckPath: /health